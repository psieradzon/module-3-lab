[project]
name = "hof-app"
version = "0.1.0"
description = "A small FastAPI application for a GitHub Copilot workshop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "pytest>=8.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
