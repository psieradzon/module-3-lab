<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hof-App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <a class="brand" href="{{ url_for('yard_list') }}">Hof-App</a>
        <span class="environment-label">Workshop-Übung</span>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="container site-footer">
      Fiktive Beispielanwendung zu Lernzwecken.
    </footer>
  </body>
</html>
